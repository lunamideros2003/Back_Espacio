databases:
  - name: astroia-db
    plan: free
    databaseName: astroia

services:
  - type: web
    name: astroia-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astroia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NASA_API_KEY
        value: DEMO_KEY
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CORS_ORIGINS
        value: http://localhost:5173
