services:
  - type: web
    name: astroia-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Supabase -> Settings -> Database -> Connection string.
      # Use the "Connection pooling" URI (port 6543) for Render.
      - key: DATABASE_URL
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: NASA_API_KEY
        value: DEMO_KEY
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Origenes extra. El de Vercel ya viene en el codigo, no hace falta ponerlo.
      - key: CORS_ORIGINS
        value: ""
